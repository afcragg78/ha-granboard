new_game:
  fields:
    device_id:
      selector:
        device:
          integration: granboard
    game:
      required: true
      example: x01
      selector:
        select:
          options: [x01, cricket, count_up, around_the_clock]
          translation_key: game
    start:
      default: 501
      selector:
        select:
          options: ["301", "501", "701"]
    double_out:
      default: false
      selector:
        boolean:
    rounds:
      selector:
        number:
          min: 0
          max: 99
          mode: box
    players:
      example: '["Andrew", "Guest"]'
      selector:
        text:
          multiple: true
    colors:
      example: '["#ff0000", "blue"]'
      selector:
        text:
          multiple: true
undo:
  fields: &device
    device_id:
      selector:
        device:
          integration: granboard
next_player:
  fields: *device
end_game:
  fields: *device
throw:
  fields:
    device_id:
      selector:
        device:
          integration: granboard
    segment:
      required: true
      example: T20
      selector:
        text:
led:
  fields:
    device_id:
      selector:
        device:
          integration: granboard
    effect:
      required: true
      example: segment
      selector:
        select:
          options: [segment, blink, wave, ring, numbers, clear, sweep, wipe, award, rainbow, raw]
    segment:
      example: T20
      selector:
        text:
    color:
      example: "#ff0000"
      selector:
        text:
    color2:
      example: white
      selector:
        text:
    blinks:
      selector:
        number:
          min: 1
          max: 3
    duration:
      selector:
        number:
          min: 1
          max: 255
          mode: box
    numbers:
      example: "[20, 19, 18]"
      selector:
        object:
    award:
      example: ton_80
      selector:
        select:
          options: [bullseye, bust, ton, ton_40, high_ton, ton_80, hat_trick, three_in_a_bed, white_horse, checkout, winner]
    raw:
      advanced: true
      example: "10 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00"
      selector:
        text:

add_player:
  fields:
    device_id:
      selector:
        device:
          integration: granboard
    name:
      required: true
      example: Andrew
      selector:
        text:
    color:
      example: "#00f5ff"
      selector:
        text:
    initials:
      example: AN
      selector:
        text:
    avatar:
      example: /local/granboard/players/andrew.jpg
      selector:
        text:
update_player:
  fields:
    device_id:
      selector:
        device:
          integration: granboard
    player_id:
      required: true
      example: "a1b2c3d4e5f64789a0b1c2d3e4f50607"
      selector:
        text:
    name:
      selector:
        text:
    color:
      example: "#7c5cff"
      selector:
        text:
    initials:
      selector:
        text:
    avatar:
      selector:
        text:
remove_player:
  fields:
    device_id:
      selector:
        device:
          integration: granboard
    player_id:
      required: true
      selector:
        text:
set_lineup:
  fields:
    device_id:
      selector:
        device:
          integration: granboard
    players:
      required: true
      example: '["Andrew", "Guest"]'
      selector:
        text:
          multiple: true
    colors:
      example: '["#00f5ff", "blue"]'
      selector:
        text:
          multiple: true

