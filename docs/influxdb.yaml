# Filter-only Home Assistant InfluxDB config for Granboard career charts.
# The InfluxDB *connection* (URL, database, username, password) is set in the
# UI on Home Assistant 2026.x (Settings > Devices & services > InfluxDB).
# Do not put host / port / database / username / password here.
#
# Paste this top-level `influxdb:` block into configuration.yaml (or a
# package) after you have a backup. See docs/INFLUX-GRAFANA.md.
#
# measurement_attr: entity_id makes each sensor its own Influx measurement
# (for example sensor.game_room_granboard_3s_andrew_3_dart_average). That is
# more consistent than the default (measurement = unit of measurement, or the
# entity id when there is no unit). tags_attributes copies player / player_id
# onto each point so Grafana can filter by player.

influxdb:
  measurement_attr: entity_id
  tags_attributes:
    - player
    - player_id
  include:
    entities:
      - sensor.game_room_granboard_3s_players
      - sensor.game_room_granboard_3s_game
      - sensor.game_room_granboard_3s_last_hit
      - sensor.game_room_granboard_3s_last_visit_score
      - sensor.game_room_granboard_3s_last_dart_score
    entity_globs:
      - sensor.*_granboard_*_players
      - sensor.*_granboard_*_game
      - sensor.*_granboard_*_last_hit
      - sensor.*_granboard_*_last_visit_score
      - sensor.*_granboard_*_last_dart_score
      - sensor.*_granboard_*_*_3_dart_average
      - sensor.*_granboard_*_*_first_9_average
      - sensor.*_granboard_*_*_checkout_percent
      - sensor.*_granboard_*_*_180s
      - sensor.*_granboard_*_*_ton_plus
      - sensor.*_granboard_*_*_games_played
      - sensor.*_granboard_*_*_games_won
      - sensor.*_granboard_*_*_cricket_mpr
      - sensor.*_granboard_*_*_highest_checkout
  exclude:
    entity_globs:
      - light.*granboard*
      - light.wled*
      - number.*granboard*
      - select.*granboard*ring*
      - text.*granboard*ring*
      - switch.*granboard*
      - binary_sensor.*granboard*
